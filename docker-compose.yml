# Local PostgreSQL for development — works the same on Windows 11 (Docker Desktop),
# macOS and Linux. Production hosting is a separate Phase 5 decision.
services:
  db:
    image: postgres:16-alpine
    container_name: school-saas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-school_saas}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - school_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school} -d ${POSTGRES_DB:-school_saas}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  school_pgdata:
